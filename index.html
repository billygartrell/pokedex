<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d93636">
    <meta name="description" content="Track caught Pokemon from Pokemon Scarlet and Violet.">
    <title>Scarlet & Violet Pokedex</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <section class="trainer-panel" aria-label="Trainer profile">
        <div class="trainer-row" role="group" aria-label="Choose trainer">
          <button class="trainer-button active" type="button" data-trainer="billy" aria-pressed="true">Billy</button>
          <button class="trainer-button" type="button" data-trainer="friend" aria-pressed="false">John</button>
        </div>
      </section>

      <nav class="view-tabs" aria-label="Tracker view">
        <button class="view-tab active" type="button" data-view="pokedex" aria-pressed="true">
          <svg class="tab-icon" aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h6"></path>
            <path d="M15 12h6"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>Pokedex</span>
        </button>
        <button class="view-tab" type="button" data-view="accolades" aria-pressed="false">
          <svg class="tab-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M8 4h8v4a4 4 0 0 1-8 0z"></path>
            <path d="M8 6H5a3 3 0 0 0 3 4"></path>
            <path d="M16 6h3a3 3 0 0 1-3 4"></path>
            <path d="M12 12v5"></path>
            <path d="M8 20h8"></path>
            <path d="M10 17h4"></path>
          </svg>
          <span>Accolades</span>
        </button>
      </nav>

      <header class="app-header">
        <div>
          <p id="pageEyebrow" class="eyebrow">Paldea Region Pokedex</p>
          <h1>
            <span class="version-word scarlet-word">Scarlet</span>
            <span class="title-amp">&amp;</span>
            <span class="version-word violet-word">Violet</span>
          </h1>
        </div>
        <div class="progress-card" aria-live="polite">
          <span class="progress-pokeball" aria-hidden="true">
            <span class="pokeball-icon progress-pokeball-icon">
              <span class="pokeball-button-dot"></span>
            </span>
          </span>
          <span id="caughtCount" class="progress-number">0</span>
          <small id="progressLabel">caught</small>
        </div>
      </header>

      <section id="pokedexControls" class="controls view-section" aria-label="Pokedex controls" data-view-section="pokedex">
        <label class="search-box">
          <span class="sr-only">Search Pokemon</span>
          <input id="searchInput" type="text" autocomplete="off" placeholder="Search by name, number, or type">
          <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search" hidden>
            <span aria-hidden="true">×</span>
          </button>
        </label>
        <div class="filter-row" role="group" aria-label="Filter Pokemon">
          <button class="filter-button active" type="button" data-filter="all">All</button>
          <button class="filter-button" type="button" data-filter="caught">Caught</button>
          <button class="filter-button" type="button" data-filter="missing">Missing</button>
        </div>
      </section>

      <section id="accoladesView" class="journey-panel view-section" aria-label="Journey accolades" data-view-section="accolades" hidden>
        <section class="controls accolades-controls" aria-label="Accolades controls">
          <label class="search-box">
            <span class="sr-only">Search accolades</span>
            <input id="accoladeSearchInput" type="text" autocomplete="off" placeholder="Search by badge, titan, or crew">
            <button id="clearAccoladeSearch" class="clear-search" type="button" aria-label="Clear accolade search" hidden>
              <span aria-hidden="true">×</span>
            </button>
          </label>
          <div class="filter-row" role="group" aria-label="Filter accolades">
            <button class="accolade-filter-button active" type="button" data-filter="all">All</button>
            <button class="accolade-filter-button" type="button" data-filter="complete">Done</button>
            <button class="accolade-filter-button" type="button" data-filter="missing">Missing</button>
          </div>
        </section>
        <div class="journey-heading">
          <div>
            <p class="journey-kicker">Journey</p>
            <h2>Accolades</h2>
          </div>
          <p id="journeyTotal" class="journey-total">0 / 18</p>
        </div>
        <div id="journeyStats" class="journey-stats" aria-label="Accolade stats"></div>
        <div id="milestoneGroups" class="milestone-groups"></div>
      </section>

      <main id="pokedexView" class="view-section" data-view-section="pokedex">
        <div class="status-line">
          <span id="visibleCount">400 Pokemon</span>
          <details id="resetMenu" class="overflow-menu">
            <summary class="overflow-trigger" aria-label="More actions">
              <span aria-hidden="true">•••</span>
            </summary>
            <div class="overflow-panel">
              <button id="clearCaught" class="menu-action danger-action" type="button">Reset Pokedex</button>
            </div>
          </details>
        </div>
        <ul id="pokemonList" class="pokemon-list" aria-label="Paldea Pokemon"></ul>
        <p id="emptyState" class="empty-state" hidden>No Pokemon match that view.</p>
      </main>
    </div>

    <dialog id="resetDialog" class="reset-dialog" aria-labelledby="resetDialogTitle">
      <form method="dialog" class="reset-dialog-card">
        <h2 id="resetDialogTitle">Reset <span id="resetTrainerName">this trainer</span>'s Pokedex?</h2>
        <p>This will mark every Pokemon as missing for this trainer. The other trainer's Pokedex will not be changed.</p>
        <div class="dialog-actions">
          <button id="cancelReset" class="dialog-button secondary-dialog-button" type="button">Cancel</button>
          <button id="confirmReset" class="dialog-button danger-dialog-button" type="button">Reset</button>
        </div>
      </form>
    </dialog>

    <template id="pokemonCardTemplate">
      <li class="pokemon-card">
        <div class="pokemon-card-inner">
          <span class="sprite-frame">
            <img alt="">
            <span class="ownership-dots" role="img">
              <span class="ownership-dot billy-dot"></span>
              <span class="ownership-dot john-dot"></span>
            </span>
          </span>
          <span class="pokemon-info">
            <span class="pokemon-meta">
              <span class="pokemon-number"></span>
            </span>
            <span class="pokemon-name"></span>
            <span class="type-row"></span>
          </span>
          <button class="catch-toggle" type="button">
            <span class="sr-only caught-label"></span>
            <span class="pokeball-icon" aria-hidden="true">
              <span class="pokeball-button-dot"></span>
            </span>
          </button>
        </div>
      </li>
    </template>

    <script src="pokemon-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
